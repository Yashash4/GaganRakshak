name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
      - name: Install (locked dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy gaganrakshak/sample.py gaganrakshak/evidence.py gaganrakshak/crypto.py gaganrakshak/evidence_log.py gaganrakshak/commit.py gaganrakshak/cmd_sign.py gaganrakshak/protocol.py gaganrakshak/link_monitor.py gaganrakshak/integrity.py
      - name: Tests (without SITL)
        run: pytest -m "not sitl" --cov=gaganrakshak --cov-report=term --cov-report=xml
      - name: Coverage summary
        run: |
          python -c "import xml.etree.ElementTree as E; r=E.parse('coverage.xml').getroot(); print(f\"Line coverage: {float(r.get('line-rate'))*100:.1f} %\")" >> "$GITHUB_STEP_SUMMARY"
