# a5_link_flood at range: the same attack on long legs (200-450 m) where the radio fades with distance,
# so detection and false alarms are measured in the far distance bands too. Development/test variant.
name: a5_link_flood_far
duration_s: 240
mission: {legs: 3, radius_m: [200, 450], alt_m: [25, 35], speed_ms: [8, 12]}
wind: {spd: [0, 3], dir: [0, 360], turb: 0}
gnss_noise: {sigma_m: 2.1, tau_s: 60}
link: {loss_d50_m: 350, loss_scale_m: 60}
attack: {duration_s: [15, 25], params: {bytes_per_s: [10000, 20000]}, start_s: [30, 150],
  type: link_flood}
